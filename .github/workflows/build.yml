name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS first: it's the main platform (universal binary, AU, installer).
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev

      # On macOS this builds a universal binary (Apple Silicon + Intel); other platforms ignore it.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      # Limited parallelism: the Linux runner runs out of memory compiling JUCE with unbounded jobs.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # macOS: ad-hoc sign, run Apple's auval on both Audio Units, build the installer.
      - name: Sign, validate and package
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh build

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Bouquet-macOS-installer
          path: build/Bouquet-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins-${{ runner.os }}
          path: |
            build/Bouquet/Bouquet_artefacts/Release/VST3
            build/Bouquet/Bouquet_artefacts/Release/AU
            build/Bouquet/BouquetFX_artefacts/Release/VST3
            build/Bouquet/BouquetFX_artefacts/Release/AU
            build/Bouquet/BouquetReal_artefacts/Release/VST3
            build/Bouquet/BouquetReal_artefacts/Release/AU
            build/Bouquet/BouquetRealFX_artefacts/Release/VST3
            build/Bouquet/BouquetRealFX_artefacts/Release/AU
            build/SimpleSynth/SimpleSynth_artefacts/Release/VST3
