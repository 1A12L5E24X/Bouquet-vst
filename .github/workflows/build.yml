name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev

      # On macOS this builds a universal binary (Apple Silicon + Intel); other platforms ignore it.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      # Limited parallelism: the Linux runner runs out of memory compiling JUCE with unbounded jobs.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins-VST3-${{ runner.os }}
          path: |
            build/Murmur/Murmur_artefacts/Release/VST3
            build/Murmur/MurmurFX_artefacts/Release/VST3
            build/SimpleSynth/SimpleSynth_artefacts/Release/VST3
